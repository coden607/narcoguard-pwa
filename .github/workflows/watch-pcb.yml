name: Watch PCB Engineering

on:
  pull_request:
    paths:
      - ".github/workflows/watch-pcb.yml"
      - "app/watch/page.tsx"
  push:
    branches: [main]
    paths:
      - ".github/workflows/watch-pcb.yml"
      - "app/watch/page.tsx"

permissions:
  contents: read

jobs:
  pcb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PCB fabrication files are not in this public repository
        run: |
          echo "Gerbers, drill files and the board specification are proprietary."
          echo "They are not fabrication-ready and are not stored in this public repository."
          echo "Copyright (c) 2026 Stephen Blanford / NarcoGuard. All rights reserved. Not licensed under MIT."
