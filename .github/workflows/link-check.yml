name: Resource Link Check

on:
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check resource and hotline links
        run: node tools/link-check.mjs | tee link-report.txt
      - name: Publish report
        if: always()
        run: |
          {
            echo "## Resource link check report"
            echo ""
            cat link-report.txt
          } >> "$GITHUB_STEP_SUMMARY"