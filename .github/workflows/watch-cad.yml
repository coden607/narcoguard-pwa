name: Watch CAD Validation

on:
  pull_request:
    paths:
      - ".github/workflows/watch-cad.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/watch-cad.yml"

permissions:
  contents: read

jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Engineering package is not in this public repository
        run: |
          echo "Rev 5 manufacturing CAD is proprietary and is not stored in this public repository."
          echo "Copyright (c) 2026 Stephen Blanford / NarcoGuard. All rights reserved. Not licensed under MIT."
