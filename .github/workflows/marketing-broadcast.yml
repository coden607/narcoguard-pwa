name: Marketing Broadcast

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish scheduled posts through the configured relay"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate-marketing-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate platform-specific marketing bundle
        run: npm run marketing:run
        env:
          MARKETING_RELAY_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.MARKETING_RELAY_URL || '' }}
          ALLOW_MARKETING_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
          FORCE_DAY: ${{ vars.MARKETING_FORCE_DAY }}
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-bundle
          path: marketing/posts/
          retention-days: 14
