name: Marketing Broadcast

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-marketing-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate platform-specific marketing bundle
        run: npm run marketing:run
        env:
          MARKETING_RELAY_URL: ${{ secrets.MARKETING_RELAY_URL }}
          FORCE_DAY: ${{ vars.MARKETING_FORCE_DAY }}
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-bundle
          path: marketing/posts/
          retention-days: 14
